# =============================================================================
# Pipeline configuration
# =============================================================================

# Table of samples to process: sample name -> paths to paired-end FASTQ files.
# See config/samples.tsv (loaded by the Snakefile).
samples_tsv: "config/samples.tsv"

# Reference genome that reads are mapped to for variant calling.
# In a real AMR-PLAS-style project this would be a public reference genome
# for the species/strain under study (e.g. an ESKAPE reference from
# NCBI RefSeq, or an M. tuberculosis H37Rv-type reference).
reference: "resources/reference_genome.fasta"

# Curated AMR marker gene database used for BLAST-based gene screening.
# Swap for a real database (CARD, ResFinder, NCBI AMRFinderPlus) for
# production use -- see README.md "Using real data".
amr_db: "resources/amr_marker_db.fasta"

# --- Demo/test mode -----------------------------------------------------
# If a sample's FASTQ files (as listed in samples.tsv) don't exist yet,
# and the sample is listed here, the pipeline simulates them from the
# given genome so the whole workflow can be smoke-tested offline.
# For real samples: just don't list them here, and put real fastq.gz
# files at the paths given in samples.tsv -- Snakemake will see they
# already exist and skip simulation entirely.
demo_samples:
  isolate01_resistant: "resources/sim_genomes/isolate01_resistant.fasta"
  isolate02_susceptible: "resources/sim_genomes/isolate02_susceptible.fasta"

simulate_reads:
  coverage: 40
  read_length: 150
  frag_mean: 400
  frag_sd: 40
  error_rate: 0.01
  seed: 7

# --- Tool parameters ------------------------------------------------------
fastp:
  extra: "--qualified_quality_phred 20 --length_required 50"

spades:
  extra: "--isolate"   # appropriate mode for high-coverage isolate WGS

amr_screen:
  min_identity: 90     # % nucleotide identity threshold for a "hit"
  min_coverage: 80      # % of marker-gene length that must be covered

variant_calling:
  min_qual: 20          # minimum QUAL for a variant to survive filtering
